# .github/workflows/android-release.yml

name: Android Release Build

# Define triggers for the workflow
on:
  # Allow manual triggering from the Actions tab in GitHub
  workflow_dispatch:

  # Automatically trigger on pushing tags matching v*.*.* (e.g., v1.0.0, v2.1.3)
  push:
    tags:
      - 'v*.*.*' # Trigger on version tags (like v1.0, v2.3.4)

jobs:
  # Define the build job
  build-android:
    name: Build Signed Android Release APK
    # Specify the runner environment (GitHub-hosted Ubuntu runner)
    runs-on: ubuntu-latest

    # Define environment variables accessible to all steps in this job
    env:
      # These environment variables are set using GitHub Secrets
      # Make sure these secrets exist in your repository:
      # Settings > Secrets and variables > Actions > Repository secrets
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # Define the path where the keystore file will be placed after decoding
      # This path MUST match where your build.gradle expects to find the keystore
      # when reading from environment variables.
      ANDROID_RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.keystore

    # Define the sequence of steps for the job
    steps:
      # Step 1: Check out the repository code onto the runner
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up the Java Development Kit (JDK) environment
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          # Specify the Java version required by React Native / Android build
          java-version: '17' # Common requirement, adjust if needed (e.g., '11', '21')
          # Specify the JDK distribution (Eclipse Temurin is a good choice)
          distribution: 'temurin'
          # Enable caching for Gradle dependencies to speed up subsequent builds
          cache: 'gradle'

      # Step 3: Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Specify the Node.js version matching your project requirements
          node-version: '18' # Or '20', 'lts', etc. Use the version you develop with.
          # Enable caching for Node modules (use 'yarn' if your project uses Yarn)
          cache: 'npm'

      # Step 4: Install project's JavaScript dependencies
      - name: Install JavaScript Dependencies
        # 'npm ci' is preferred for CI: uses package-lock.json for deterministic installs
        run: npm ci
        # If using Yarn: run: yarn install --frozen-lockfile

      # Step 5: Set up the Android SDK environment using a dedicated action
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        # This action handles installing SDK components (platform-tools, build-tools, NDK, etc.)
        # It also sets necessary environment variables like ANDROID_SDK_ROOT.

      # Step 6: Decode the Base64 encoded keystore file from GitHub Secrets
      - name: Decode Keystore
        # ================== CRITICAL LINE ==================
        # The 'if' condition MUST be wrapped in ${{ }} expression syntax.
        # This step only runs if the secret ANDROID_RELEASE_KEYSTORE_BASE64 is not empty.
        if: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 != '' }}
        # ===================================================
        run: |
          echo "Decoding keystore from ANDROID_RELEASE_KEYSTORE_BASE64 secret..."
          # Ensure the target directory (android/app) exists before writing the file
          mkdir -p android/app
          # Decode the base64 secret and write it to the path defined by ANDROID_RELEASE_KEYSTORE_PATH
          # Ensure there are no extra spaces or characters in the secret value itself.
          echo "${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > ${{ env.ANDROID_RELEASE_KEYSTORE_PATH }}
          echo "Keystore decoded successfully to ${{ env.ANDROID_RELEASE_KEYSTORE_PATH }}"
          # Check if the file was created successfully (optional verification)
          if [ ! -f "${{ env.ANDROID_RELEASE_KEYSTORE_PATH }}" ]; then
            echo "::error::Keystore file was not created after decoding!"
            exit 1
          fi
          ls -l ${{ env.ANDROID_RELEASE_KEYSTORE_PATH }} # Print file details for debugging

      # Step 7: Make the Gradle wrapper script executable (required on Linux runners)
      - name: Make gradlew executable
        run: chmod +x ./android/gradlew

      # Step 8: Build the signed release APK using Gradle wrapper
      - name: Build Release APK
        # Execute Gradle commands from the 'android' sub-directory
        working-directory: ./android
        # Run 'clean' task first to remove previous build outputs, then 'assembleRelease'
        # The assembleRelease task should automatically pick up the release signing configuration
        # (which reads from environment variables set earlier if build.gradle is configured correctly).
        run: ./gradlew clean assembleRelease
        # Optional: Consider adding --no-daemon for potentially more stable CI runs,
        # though it might slightly increase build time.
        # run: ./gradlew clean assembleRelease --no-daemon

      # Step 9: Upload the generated APK(s) as a build artifact for download
      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          # Name of the artifact package that will be downloadable from the workflow run
          name: release-apks
          # Specify the path(s) to the files to include in the artifact.
          # This wildcard should capture the universal APK and any ABI split APKs if generated.
          path: |
            android/app/build/outputs/apk/release/*.apk
          # Optional: Set how long to keep the artifact (default is 90 days, min 1)
          retention-days: 7 # Keep artifacts for 7 days

      # Step 10: Create a GitHub Release and attach the APK(s)
      # This step only executes if the workflow was triggered by pushing a tag (e.g., v1.0.0)
      - name: Create GitHub Release
        # Condition: Only run this step if the GitHub reference triggering the workflow starts with 'refs/tags/'
        if: startsWith(github.ref, 'refs/tags/')
        # Use a popular action for creating GitHub releases
        uses: softprops/action-gh-release@v2
        with:
          # Use the tag name itself (e.g., "v1.0.0") for the release tag and name
          tag_name: ${{ github.ref_name }} # Gets the name of the tag (e.g., v1.0.0)
          name: Release ${{ github.ref_name }} # Creates a release titled "Release v1.0.0"
          # Set draft: true to create a draft release instead of publishing immediately
          # draft: false
          # Set prerelease: true to mark the release as a pre-release
          # prerelease: false
          # Specify the files (APKs) to upload to the release assets section
          files: |
            android/app/build/outputs/apk/release/*.apk
        env:
          # The GITHUB_TOKEN secret is automatically provided by GitHub Actions
          # and is required by the action-gh-release action to interact with the GitHub API.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}