name: Android Release Build

on:
  # Allows manual triggering from the Actions tab
  workflow_dispatch:

  # Automatically trigger on pushing tags matching v*.*.* (e.g., v1.0.0)
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-android:
    name: Build Signed Android Release APK
    runs-on: ubuntu-latest # Use a Linux runner

    env:
      # Set environment variables from secrets for build.gradle
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # Define the path where the keystore will be decoded
      ANDROID_RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.keystore

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17' # Match the version needed by your project/React Native version
          distribution: 'temurin' # A popular OpenJDK distribution
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts' # Or '20', 'lts', match your project needs
          cache: 'npm' # Or 'yarn' if you use Yarn

      - name: Install JavaScript Dependencies
        run: npm ci # 'npm ci' is generally preferred in CI for reproducibility using package-lock.json
        # Or: yarn install --frozen-lockfile

      # --- Android SDK Setup ---
      # Using a dedicated action is often simpler than replicating the Codespaces script
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        # This action sets up SDK, NDK, Build Tools, etc.
        # It automatically sets ANDROID_SDK_ROOT environment variable.

      # --- Handle Signing Keystore ---
      - name: Decode Keystore
        # Check if the secret exists before attempting to decode
        if: secrets.ANDROID_RELEASE_KEYSTORE_BASE64 != ''
        run: |
          echo "Decoding keystore..."
          # Ensure the target directory exists
          mkdir -p android/app
          # Decode the base64 secret into the file path defined by ANDROID_RELEASE_KEYSTORE_PATH
          echo "${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > ${{ env.ANDROID_RELEASE_KEYSTORE_PATH }}
          echo "Keystore decoded successfully to ${{ env.ANDROID_RELEASE_KEYSTORE_PATH }}"
        # Optional: Add error handling if the secret is empty but required
        # else:
        #  echo "::error::ANDROID_RELEASE_KEYSTORE_BASE64 secret is not set!"
        #  exit 1

      # --- Build Release APK ---
      - name: Make gradlew executable
        run: chmod +x ./android/gradlew

      - name: Build Release APK
        working-directory: ./android # Run gradle from the android directory
        run: ./gradlew clean assembleRelease
        # Optional: Add --no-daemon for potentially cleaner CI runs
        # run: ./gradlew clean assembleRelease --no-daemon

      # --- Upload Artifact ---
      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apks # Name of the artifact zip file
          path: | # Paths to include in the artifact
            android/app/build/outputs/apk/release/*.apk
          retention-days: 7 # Optional: How long to keep the artifact

      # --- Create GitHub Release (Optional - only runs on tag push) ---
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') # Only run this step if triggered by a tag
        uses: softprops/action-gh-release@v2
        with:
          # Use the tag name for the release name and tag
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          # Optional: Set to true to create a draft release
          # draft: false
          # Optional: Set to true to mark as pre-release
          # prerelease: false
          # Upload all APKs found in the release output directory
          files: |
            android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Required for creating releases