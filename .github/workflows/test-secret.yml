name: Test Secret Condition via Env Var

on: workflow_dispatch # Manual trigger

jobs:
  test:
    runs-on: ubuntu-latest

    # Set an environment variable based on the secret's presence FOR THE JOB
    # Note: We use '==' here because we are assigning a string result ('true' or 'false')
    env:
      SECRET_IS_SET: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 != '' }}

    steps:
      # Step 1: Check the intermediate environment variable
      - name: Check Env Var - Secret Is Set
        # Now we check the env context. No ${{ }} needed for simple env var check.
        # We compare against the string 'true' that we set above.
        if: env.SECRET_IS_SET == 'true'
        run: |
          echo "Intermediate env var SECRET_IS_SET is 'true'."
          echo "This means the original secret likely exists and is not empty."

      # Step 2: Check the opposite condition for the env var
      - name: Check Env Var - Secret Is NOT Set or Empty
        # Check if the env var is 'false'
        if: env.SECRET_IS_SET == 'false'
        run: |
          echo "Intermediate env var SECRET_IS_SET is 'false'."
          echo "This means the original secret likely does not exist or is empty."

      # Step 3: Always run step for comparison
      - name: Always Run
        run: |
          echo "This step always runs."
          echo "Value of env.SECRET_IS_SET was: ${{ env.SECRET_IS_SET }}" # Print the actual value
